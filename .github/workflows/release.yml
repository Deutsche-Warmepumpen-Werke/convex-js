name: Release package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      # npm 10 crashes while resolving the scripts/openapi workspace.
      - name: NPM v11
        run: npm install -g npm@11.19.1 --registry=https://registry.npmjs.org

      # The build runs scripts/build.py through uv.
      - name: Python build tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - run: npm i

      - run: npm run test:build-cache

      - run: npm run typecheck

      - run: npm test

      # Release exactly the checked-out commit.
      - name: Reject validation side effects
        run: git diff --exit-code

      # Build metadata keeps the version inside ordinary convex@^1.x peer
      # ranges; a prerelease suffix would not satisfy them.
      - name: Set release version
        id: version
        run: |
          base="$(node -p 'require("./package.json").version')"
          version="${base}+dww.${GITHUB_SHA::12}"
          tag="dww-v${base}-${GITHUB_SHA::12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Releases are immutable."
            exit 1
          fi
          npm pkg set version="$version"
          sed -i "s/^export const version = \"${base}\";$/export const version = \"${version}\";/" src/index.ts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # prepack deletes stale tarballs, runs the full build and checks that
      # both versions match.
      - name: Pack
        run: |
          npm pack
          mv convex-*.tgz convex.tgz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          integrity="sha512-$(openssl dgst -sha512 -binary convex.tgz | base64 -w0)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/convex.tgz"
          notes="$(printf 'convex@%s from %s\n\nInstall: `%s`\n\nIntegrity: `%s`\n' "$VERSION" "$GITHUB_SHA" "$url" "$integrity")"
          gh release create "$TAG" convex.tgz \
            --target "$GITHUB_SHA" \
            --title "convex $VERSION" \
            --notes "$notes"
          printf '%s\n' "$notes" >> "$GITHUB_STEP_SUMMARY"
